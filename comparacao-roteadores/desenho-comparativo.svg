<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Comparativo arquitetural: Apigee AI Gateway versus LiteLLM</title>
<desc id="desc">Duas arquiteturas em paralelo mostrando clientes, autenticação, seleção de modelo, fallback, provedores LLM, observabilidade e dependências externas. Apigee usa proxies e políticas; LiteLLM usa Router especializado e adaptadores.</desc>
<defs>
 <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
 <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#122035}
 .heading{font-weight:800;font-size:26px}
 .sub{font-size:15px;fill:#475569}
 .boxTitle{font-size:17px;font-weight:750}
 .small{font-size:13px;fill:#42526b}
 .tag{font-size:12px;font-weight:700}
 ]]></style>
</defs>
