<text x="70" y="978" class="small">Apigee: rotear por políticas; critérios como custo e menor latência requerem lógica própria.</text>
<text x="70" y="999" class="small">LiteLLM: Router especializado; recursos de orçamento e cache exigem configuração/infra. Setas de dependência são relações lógicas.</text>
